name: 01 hello
on:
  push:
  workflow_dispatch:
jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
    - name: Check out my code
      uses: actions/checkout@v4
    - name: print a message
      run: echo "The trigger fired and this step ran."
    - name: show the machine I'm on
      run: |
        uname -a
        whoami
        echo "this runner is fresh and thrown away after the job."
      
